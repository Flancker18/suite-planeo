[package]
name = "guitar-amp"
version = "0.1.0"
edition = "2021"
description = "Ampli de guitare virtuel : ampli, pédales d'effets, accordeur, métronome, enregistrement"

[dependencies]
cpal = "0.15"
slint = "1"
crossbeam-queue = "0.3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
